backend = "glx";

vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;

fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "92:class_g = 'kitty'"
];

opacity-rule = [
  "100:class_g = 'Conky'"
];

opacity-rule = [
  "85:class_g = 'dmenu'"
];

corner-radius = 0;

blur-method = "none";
